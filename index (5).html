<style id="page-style">
/* Layout: sticky app-style header, split hero (name + cover), two-column journey, folder-style collection browser, green contact band, owner edit layer (login dialog, edit bar, forms) */
:root{
  --bg:#f7f7f2; --surface:#ffffff; --line:#e6e6dc; --ink:#1c4a38; --text:#5c685f; --muted:#9a9f97;
  --link:#55775f; --brand:#1d5a45; --on-brand:#ffffff; --tile:#e4ebd9; --tile-ink:#a9b99b; --chip:#ecefe4;
  --cover-bg:#e8eddf; --cover-line:#bccaab; --cover-index:#6f9279; --danger:#b3261e;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1913; --surface:#16231b; --line:#27382d; --ink:#d9e8dc; --text:#a4b4a9; --muted:#74857a;
    --link:#8bb89b; --brand:#2c7a5c; --on-brand:#ffffff; --tile:#22342a; --tile-ink:#6e8f7a; --chip:#1e2f25;
    --cover-bg:#13211a; --cover-line:#2b4638; --cover-index:#5f9a7c; --danger:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1913; --surface:#16231b; --line:#27382d; --ink:#d9e8dc; --text:#a4b4a9; --muted:#74857a;
  --link:#8bb89b; --brand:#2c7a5c; --on-brand:#ffffff; --tile:#22342a; --tile-ink:#6e8f7a; --chip:#1e2f25;
  --cover-bg:#13211a; --cover-line:#2b4638; --cover-index:#5f9a7c; --danger:#ff8a80; color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:8px}
svg{display:block}

.wrap{max-width:1120px;margin:0 auto;
  padding-left:max(clamp(16px,4vw,32px),env(safe-area-inset-left,0px));
  padding-right:max(clamp(16px,4vw,32px),env(safe-area-inset-right,0px))}
section[id]{scroll-margin-top:92px}

.eyebrow{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0}
h1,h2,h3{margin:0;font-weight:500;color:var(--ink)}
h1,h2{font-family:var(--display);text-wrap:balance}
h2{font-size:clamp(32px,4.6vw,52px);line-height:1.1;letter-spacing:-.01em}

/* header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.head-in{display:flex;align-items:center;gap:12px;height:72px}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:18px;color:var(--ink);text-decoration:none;min-width:0;margin-right:auto}
.brand .bt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{flex:none}
.logo{width:44px;height:44px;border-radius:14px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:30px}
.nav a{text-decoration:none;font-weight:500;font-size:15px;color:var(--text)}
.nav a:hover{color:var(--ink)}
.login{flex:none;padding:9px 18px;font-size:14px}
.menu-btn{display:none;width:44px;height:44px;border-radius:12px;place-items:center;color:var(--ink)}
@media (max-width:760px){
  .menu-btn{display:grid}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:0;
    background:var(--bg);border-bottom:1px solid var(--line);
    padding:4px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
  .site-head.open .nav{display:flex}
  .nav a{padding:14px 0;border-top:1px solid var(--line);font-size:16px}
  .nav a:first-child{border-top:0}
  .login{padding:9px 16px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px;text-decoration:none;border:1.5px solid transparent;cursor:pointer}
.btn.solid{background:var(--brand);color:var(--on-brand)}
.btn.line{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn.line:hover{border-color:var(--link)}
.btn.solid:hover{filter:brightness(1.08)}
.btn.sm{padding:9px 16px;font-size:14px}
.btn[disabled]{opacity:.6;cursor:default}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,64px);align-items:center;
  padding-block:clamp(36px,6vw,80px) clamp(40px,6vw,72px)}
.hero > *{min-width:0}
.hero h1{font-size:clamp(46px,7.6vw,86px);line-height:1.02;letter-spacing:-.015em;margin:18px 0 18px;overflow-wrap:anywhere}
.uni{font-size:clamp(17px,2.1vw,21px);color:var(--text);margin:0}
.role{font-weight:600;color:var(--ink);margin:4px 0 0}
.intro{max-width:52ch;line-height:1.75;margin:22px 0 0;font-size:17px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:26px}
.chips .lab{font-size:13px;font-weight:600;color:var(--muted);margin-right:4px}
.chip{background:var(--chip);color:var(--ink);font-size:13.5px;font-weight:500;padding:7px 14px;border-radius:999px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}

.cover{position:relative;border-radius:32px;overflow:hidden;border:1px solid var(--line);background:var(--cover-bg);aspect-ratio:5/5.4;max-width:100%}
.cover canvas,.cover .cover-img{position:absolute;inset:0;width:100%;height:100%}
.cover .cover-img{object-fit:cover}
.cover-tag{position:absolute;top:18px;left:18px;background:var(--surface);color:var(--ink);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
.cover-quote{position:absolute;left:18px;bottom:18px;right:18px;max-width:330px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 22px}
.cover-quote strong{display:block;color:var(--ink);font-size:17px;line-height:1.35;font-weight:600}
.cover-quote .eyebrow{font-size:10.5px;margin-top:8px}
@media (max-width:880px){
  .hero{grid-template-columns:1fr}
  .cover{aspect-ratio:4/3.6}
}

/* journey */
.journey{padding-block:clamp(40px,6vw,72px);border-top:1px solid var(--line)}
.sec-head{display:flex;flex-direction:column;gap:14px;margin-bottom:clamp(28px,4vw,44px)}
.sec-head p.sub{margin:0;font-size:17px;max-width:56ch}
.j-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,64px)}
.j-grid > *{min-width:0}
@media (max-width:880px){.j-grid{grid-template-columns:1fr}}

.timeline{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 34px 30px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-8px;top:5px;width:14px;height:14px;border-radius:50%;
  background:var(--bg);border:3px solid var(--link)}
.timeline li.now::before{background:var(--brand);border-color:var(--brand)}
.when{font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.timeline h3{font-size:21px;font-weight:600;line-height:1.3;margin:6px 0 4px}
.timeline p{margin:0}
.gpa{display:inline-block;margin-top:10px;background:var(--chip);color:var(--ink);font-size:13.5px;font-weight:600;padding:5px 12px;border-radius:999px;font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,3vw,30px)}
.stack{display:flex;flex-direction:column;gap:20px}
.card h3{font-size:20px;font-weight:700;margin-bottom:18px}
.grp{margin:20px 0 4px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.grp:first-of-type{margin-top:0}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .nm{color:var(--ink);font-weight:500}
.meter{display:flex;align-items:center;gap:5px;flex:none}
.meter i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--link)}
.meter em{font-style:normal;font-size:13px;color:var(--muted);width:92px;text-align:right}

.tc{display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,4vw,48px);margin-top:clamp(28px,4vw,44px)}
.tc > *{min-width:0}
.tc h3{margin-bottom:14px}
.tc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tc li{display:flex;gap:12px;align-items:baseline;color:var(--ink);font-weight:500}
.tc li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tile-ink);flex:none;transform:translateY(-1px)}
.tc p{margin:0}
.tc .btn{margin-top:20px;padding:11px 18px;font-size:14px}
@media (max-width:760px){.tc{grid-template-columns:1fr}}

/* collections */
.collections{padding-block:clamp(40px,6vw,72px);border-top:1px solid var(--line)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:20px;color:var(--ink);margin-bottom:20px}
.crumbs svg{color:var(--ink)}
.crumbs button{color:var(--ink);font-weight:500}
.crumbs button:hover{text-decoration:underline;text-underline-offset:4px}
.crumbs .here{color:var(--muted);font-weight:500}
.crumbs .sep{color:var(--muted)}
.ctools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.search{position:relative;margin-bottom:28px}
.search svg{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:58px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-size:17px;padding:0 20px 0 58px}
.search input::placeholder{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:20px}
.cwrap{position:relative;display:flex;min-width:0}
.cwrap > .fcard{flex:1;min-width:0}
.fcard{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:270px;background:var(--surface);
  border:2px solid var(--line);border-radius:32px;padding:clamp(22px,3vw,30px);transition:border-color .15s,transform .15s}
button.fcard:hover{border-color:var(--tile-ink);transform:translateY(-2px)}
.tile{width:76px;height:76px;border-radius:22px;background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;margin-bottom:10px}
.thumb{display:block;width:100%;aspect-ratio:16/10;border-radius:20px;overflow:hidden;background:var(--tile);margin-bottom:10px}
.thumb img{width:100%;height:100%;object-fit:cover}
.fname{font-size:clamp(20px,2.4vw,24px);font-weight:700;color:var(--ink);line-height:1.25;overflow-wrap:anywhere}
.fmeta{color:var(--muted);font-size:16px}
.fdesc{color:var(--text);font-size:15.5px;line-height:1.6;overflow-wrap:anywhere}
.fopen{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--link);font-size:17px;text-decoration:none}
.fcard .spacer{flex:1}
.acts{position:absolute;top:16px;right:16px;display:none;gap:6px}
body.editing .acts{display:flex}
.ico{min-width:38px;height:38px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;font-size:13px;font-weight:600;padding:0 12px}
.ico:hover{border-color:var(--link)}
.ico.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.empty{border:2px dashed var(--line);border-radius:28px;padding:44px 24px;text-align:center;color:var(--muted);grid-column:1/-1}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){.fcard{transition:none}button.fcard:hover{transform:none}}

/* contact */
.contact{padding-block:clamp(12px,3vw,24px) clamp(48px,7vw,88px)}
.band{background:var(--brand);color:var(--on-brand);border-radius:32px;padding:clamp(28px,5vw,56px)}
.band .eyebrow{color:var(--on-brand);opacity:.72}
.band h2{color:var(--on-brand);margin:14px 0 14px;max-width:18ch}
.band p{margin:0;max-width:52ch;opacity:.9;font-size:17px}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:28px}
.mail code{font-family:var(--body);font-size:18px;font-weight:600;background:rgba(255,255,255,.14);padding:12px 18px;border-radius:16px;overflow-wrap:anywhere;user-select:all}
.band .btn{padding:12px 20px;font-size:15px}
.band .btn.white{background:var(--on-brand);color:var(--brand)}
.band .btn.ghost{border-color:rgba(255,255,255,.5);color:var(--on-brand)}
.band .btn.ghost:hover{border-color:var(--on-brand)}

/* footer */
.site-foot{border-top:1px solid var(--line);padding-block:30px 40px}
.site-foot .eyebrow{font-size:12px}
.site-foot p.nm{margin:12px 0 0;letter-spacing:.14em;color:var(--text);font-size:15px}
body.editing .site-foot{padding-bottom:120px}

/* owner edit layer */
.editbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;max-width:calc(100% - 32px);
  background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.editbar .who{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);font-size:14px}
.editbar .dot{width:9px;height:9px;border-radius:50%;background:var(--link)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(8,18,13,.58);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:28px;width:min(640px,100%);max-height:100%;overflow:auto;padding:clamp(22px,4vw,34px)}
.modal h2{font-size:clamp(26px,4vw,34px);margin-bottom:10px}
.modal p{margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-width:0}
.field label{font-weight:600;font-size:14px;color:var(--ink)}
.field input[type=text],.field input[type=email],.field textarea,.field select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.field textarea{resize:vertical;min-height:84px}
.field input[type=file]{font:inherit;font-size:14px;color:var(--text);max-width:100%}
.hint{font-size:13px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.err{color:var(--danger);font-weight:600;font-size:14px;margin:0 0 12px;min-height:1px}
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:8px}
.msg{background:var(--chip);color:var(--ink);border-radius:18px;padding:14px 16px;font-weight:500;margin:6px 0 18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.owner-link{margin-top:14px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.owner-link:hover{color:var(--ink)}
</style>

  /* ---------- login / edit mode ---------- */
  async function detect(){
    viewer = {signed:false, canEdit:false, name:''};
    try{
      if(!window.claude || !window.claude.use) return viewer;
      var u = await window.claude.use('user');
      if(!u) return viewer;
      viewer.signed = true;
      viewer.canEdit = !!(await u.canEdit());
      var me = await u.me();
      viewer.name = (me && me.name) || '';
    }catch(e){}
    return viewer;
  }
  function loginMessage(){
    if(!window.claude) return 'Login works on the published page opened from claude.ai. This copy of the page cannot check your account.';
    if(!viewer.signed) return 'No claude.ai sign-in was found for this page. Sign in to claude.ai with the account that owns this page, open the page from there, then choose Check again.';
    return 'You are signed in' + (viewer.name ? ' as ' + viewer.name : '') + ', but this account cannot edit this page. Ask the owner to give you the Editor role from the Share menu, then choose Check again.';
  }
  async function runLoginCheck(){
    $('login-msg').textContent = 'Checking your account…';
    await detect();
    if(viewer.canEdit){ closeModal(); enterEdit(true); return; }
    $('login-msg').textContent = loginMessage();
  }
  function enterEdit(announce){
    editing = true;
    document.body.classList.add('editing');
    try{ sessionStorage.setItem('sp_edit', '1'); }catch(e){}
    $('editbar').hidden = false;
    $('ctools').hidden = false;
    $('edit-who').textContent = 'Editing as ' + (viewer.name || 'owner');
    $('login-btn').textContent = 'Exit editing';
    renderGrid();
    if(announce) toast('Edit mode is on. Changes save to the live page.');
  }
  function exitEdit(){
    editing = false;
    document.body.classList.remove('editing');
    try{ sessionStorage.removeItem('sp_edit'); }catch(e){}
    $('editbar').hidden = true;
    $('ctools').hidden = true;
    $('login-btn').textContent = 'Owner login';
    renderGrid();
  }
  $('login-btn').addEventListener('click', function(){
    setMenu(false);
    if(editing){ exitEdit(); return; }
    openModal('p-login');
    runLoginCheck();
  });
  $('login-recheck').addEventListener('click', runLoginCheck);
  $('eb-exit').addEventListener('click', exitEdit);

  /* ---------- saving ---------- */
  function findResetCss(){
    var list = document.head ? document.head.getElementsByTagName('style') : [];
    for(var i=0;i<list.length;i++){
      var t = list[i].textContent || '';
      if(t.indexOf('[hidden]') !== -1 && t.indexOf('display:none') !== -1) return t;
    }
    return ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  }
  function buildDoc(st){
    var json = JSON.stringify(st).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
    var body =
      '<title>Spandhan Basu</title>' +
      '<meta name="claude:viewport-fit-sides" content="cover">' +
      FONT_LINKS +
      '<style id="page-style">' + $('page-style').textContent + '</style>' +
      '<template id="shell">' + $('shell').innerHTML + '</template>' +
      '<' + S + ' type="application/json" id="state">' + json + '</' + S + '>' +
      '<' + S + ' id="app-script">' + $('app-script').textContent + '</' + S + '>';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + findResetCss() + '</style></head><body>' + body + '</body></html>';
  }
  function errText(e){
    var c = e && e.code;
    if(c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'not_declared') return 'This account cannot save changes to the page. Ask the owner for the Editor role.';
    if(c === 'conflict') return 'Someone else saved first. The page is reloading with their version. Repeat your change after it loads.';
    if(c === 'rate_limited') return 'Saving too often. Wait a moment and try again.';
    if(c === 'too_large') return 'The page is too large to save.';
    if(c === 'invalid_content') return 'The page could not be saved because its content was rejected.';
    return 'Saving failed. Try again in a moment.';
  }
  async function commit(next){
    if(busy) return 'Another save is in progress.';
    busy = true;
    stash();
    try{
      if(!window.claude || !window.claude.use) throw {code:'not_granted'};
      var art = await window.claude.use('artifact');
      if(!art) throw {code:'not_granted'};
      await art.publish(buildDoc(next));
      return true;
    }catch(e){
      busy = false;
      return errText(e);
    }
  }
  function uploadErrText(e){
    var c = e && e.code;
    if(c === 'too_large') return 'That file is over 20 MB.';
    if(c === 'unsupported_type') return 'Use a PNG, JPG, WebP, GIF or PDF file.';
    if(c === 'quota_or_state') return 'This page has no storage left for new files.';
    if(c === 'rate_limited') return 'Uploading too often. Wait a moment and try again.';
    if(c === 'no_assets') return 'Uploads are only available to editors of this page.';
    return 'The upload failed. Try again.';
  }
  async function uploadFile(file){
    if(file.size > 20 * 1024 * 1024) throw {code:'too_large'};
    var a = window.claude && window.claude.use ? await window.claude.use('assets') : null;
    if(!a) throw {code:'no_assets'};
    var type = file.type;
    if(!type){
      var n = file.name.toLowerCase();
      type = /\.pdf$/.test(n) ? 'application/pdf' : /\.png$/.test(n) ? 'image/png' : /\.jpe?g$/.test(n) ? 'image/jpeg' : /\.webp$/.test(n) ? 'image/webp' : /\.gif$/.test(n) ? 'image/gif' : '';
    }
    var r = await a.upload(file, {type: type});
    return {id: r.id, type: r.contentType};
  }

  /* ---------- item / folder dialog ---------- */
  function openItem(ctx){
    itemCtx = ctx;
    var r = ctx.mode === 'edit' ? findNode(STATE.tree, ctx.id) : null;
    var n = r ? r.node : null;
    $('i-title').textContent = (ctx.mode === 'add' ? 'Add ' : 'Edit ') + (ctx.folder ? 'folder' : 'item');
    $('i-name').value = n ? n.name : '';
    $('i-more').hidden = !!ctx.folder;
    $('i-kind').value = (n && n.kind) || 'Certificate';
    $('i-desc').value = (n && n.desc) || '';
    $('i-file').value = '';
    $('i-rmfile').checked = false;
    $('i-rm-wrap').hidden = !(n && n.fileId);
    $('i-filenote').textContent = n && n.fileId ? 'A file is attached. Choose another to replace it.' : 'PDF or image, up to 20 MB.';
    $('i-err').textContent = '';
    $('i-save').disabled = false; $('i-save').textContent = 'Save';
    openModal('p-item');
  }
  $('new-folder').addEventListener('click', function(){ openItem({mode:'add', folder:true}); });
  $('new-item').addEventListener('click', function(){ openItem({mode:'add', folder:false}); });

  $('p-item').addEventListener('submit', async function(e){
    e.preventDefault();
    if(busy) return;
    var name = $('i-name').value.trim();
    var err = $('i-err'), save = $('i-save');
    if(!name){ err.textContent = 'Enter a title.'; $('i-name').focus(); return; }
    err.textContent = '';
    save.disabled = true; save.textContent = 'Saving…';
    var next = clone(STATE), folder = itemCtx.folder, up = null;
    try{
      var f = $('i-file').files[0];
      if(!folder && f){ save.textContent = 'Uploading…'; up = await uploadFile(f); save.textContent = 'Saving…'; }
    }catch(ex){
      err.textContent = uploadErrText(ex);
      save.disabled = false; save.textContent = 'Save';
      return;
    }
    if(itemCtx.mode === 'add'){
      var parent = nodeAt(next, path) || {kids: next.tree};
      if(folder) parent.kids.push({id: uid(), name: name, kids: []});
      else parent.kids.push({id: uid(), file: true, kind: $('i-kind').value, name: name, desc: $('i-desc').value.trim(), fileId: up ? up.id : '', fileType: up ? up.type : ''});
    } else {
      var t = findNode(next.tree, itemCtx.id);
      if(!t){ err.textContent = 'This entry no longer exists.'; save.disabled = false; save.textContent = 'Save'; return; }
      t = t.node; t.name = name;
      if(!folder){
        t.kind = $('i-kind').value; t.desc = $('i-desc').value.trim();
        if($('i-rmfile').checked){ t.fileId = ''; t.fileType = ''; }
        if(up){ t.fileId = up.id; t.fileType = up.type; }
      }
    }
    var res = await commit(next);
    if(res === true){ save.textContent = 'Saved. Reloading…'; }
    else { err.textContent = res; save.disabled = false; save.textContent = 'Save'; }
  });

  async function deleteNode(id){
    var next = clone(STATE), r = findNode(next.tree, id);
    if(!r) return;
    r.list.splice(r.list.indexOf(r.node), 1);
    toast('Deleting…');
    var res = await commit(next);
    if(res !== true) toast(res);
  }

  /* ---------- profile dialog ---------- */
  function openProfile(){
    var p = STATE.profile;
    $('p-name').value = p.name; $('p-uni').value = p.university; $('p-role').value = p.designation;
    $('p-eyebrow').value = p.eyebrow; $('p-headline').value = p.headline; $('p-intro').value = p.intro;
    $('p-skills').value = (p.skills || []).join(', ');
    $('p-email').value = p.email || '';
    $('p-links').value = (p.links || []).map(function(l){ return l.label + ' | ' + l.url; }).join('\n');
    $('p-cover').value = ''; $('p-cover-rm').checked = false;
    $('p-cover-rm-wrap').hidden = !p.coverId;
    $('p-cover-note').textContent = p.coverId ? 'A cover image is set. Choose another to replace it.' : 'Up to 20 MB. Without one, the contour map is shown.';
    $('p-err').textContent = '';
    $('p-save').disabled = false; $('p-save').textContent = 'Save profile';
    openModal('p-profile');
  }
  $('eb-profile').addEventListener('click', openProfile);

  $('p-profile').addEventListener('submit', async function(e){
    e.preventDefault();
    if(busy) return;
    var err = $('p-err'), save = $('p-save');
    function fail(msg, focusId){ err.textContent = msg; if(focusId) $(focusId).focus(); }
    function v(id){ return $(id).value.trim(); }
    var p = {
      name: v('p-name'), university: v('p-uni'), designation: v('p-role'), eyebrow: v('p-eyebrow'),
      headline: v('p-headline'), intro: v('p-intro'), email: v('p-email'),
      skills: v('p-skills').split(',').map(function(s){ return s.trim(); }).filter(Boolean).slice(0, 24),
      links: [], coverId: STATE.profile.coverId || ''
    };
    if(!p.name) return fail('Enter your name.', 'p-name');
    if(!p.headline) return fail('Enter a homepage headline.', 'p-headline');
    if(p.email && !/^[^\s@<>"]+@[^\s@<>"]+\.[^\s@<>"]+$/.test(p.email)) return fail('Enter a valid email address.', 'p-email');
    var lines = $('p-links').value.split('\n');
    for(var i=0;i<lines.length;i++){
      var ln = lines[i].trim(); if(!ln) continue;
      var m = ln.match(/^([^|]{1,40})\|\s*(https?:\/\/[^\s"<>]+)$/);
      if(!m) return fail('Link line ' + (i+1) + ' needs the form Platform | https://link', 'p-links');
      p.links.push({label: m[1].trim(), url: m[2]});
    }
    err.textContent = '';
    save.disabled = true; save.textContent = 'Saving…';
    try{
      var f = $('p-cover').files[0];
      if(f){ save.textContent = 'Uploading…'; var up = await uploadFile(f); p.coverId = up.id; save.textContent = 'Saving…'; }
      else if($('p-cover-rm').checked){ p.coverId = ''; }
    }catch(ex){
      err.textContent = uploadErrText(ex);
      save.disabled = false; save.textContent = 'Save profile';
      return;
    }
    var next = clone(STATE); next.profile = p;
    var res = await commit(next);
    if(res === true){ save.textContent = 'Saved. Reloading…'; }
    else { err.textContent = res; save.disabled = false; save.textContent = 'Save profile'; }
  });

  /* ---------- contour-map cover ---------- */
  var SEG = [null,[[3,2]],[[2,1]],[[3,1]],[[0,1]],[[0,3],[2,1]],[[0,2]],[[0,3]],[[0,3]],[[0,2]],[[0,1],[3,2]],[[0,1]],[[3,1]],[[2,1]],[[3,2]]];
  function field(u, v){
    return 0.9*Math.sin(u*1.1+0.6)*Math.cos(v*0.9-0.4) + 0.55*Math.sin(u*0.7+v*1.3+1.7) +
           0.35*Math.cos(u*2.1-v*1.6+0.3) + 0.2*Math.sin(u*3.3+v*2.7);
  }
  function pt(n, x0, y0, st, L, a, b, c, d){
    if(n === 0) return [x0 + st*(L-a)/(b-a), y0];
    if(n === 1) return [x0 + st, y0 + st*(L-b)/(c-b)];
    if(n === 2) return [x0 + st*(L-d)/(c-d), y0 + st];
    return [x0, y0 + st*(L-a)/(d-a)];
  }
  function drawCover(){
    var cv = $('cover-canvas');
    if(!cv || cv.hidden || !cv.parentElement) return;
    var box = cv.parentElement.getBoundingClientRect();
    var W = Math.max(1, Math.round(box.width)), H = Math.max(1, Math.round(box.height));
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W*dpr; cv.height = H*dpr;
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    var cs = getComputedStyle(document.documentElement);
    var thin = cs.getPropertyValue('--cover-line').trim() || '#bccaab';
    var bold = cs.getPropertyValue('--cover-index').trim() || '#6f9279';
    var step = 6, cols = Math.ceil(W/step)+1, rows = Math.ceil(H/step)+1;
    var sc = 4.4/Math.max(W,H);
    var g = new Float32Array(cols*rows);
    for(var j=0;j<rows;j++){ for(var i=0;i<cols;i++){ g[j*cols+i] = field(i*step*sc, j*step*sc); } }
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for(var li=0, L=-1.8; L<=1.81; L+=0.2, li++){
      var isIndex = li % 5 === 0;
      ctx.beginPath();
      for(var y=0;y<rows-1;y++){
        for(var x=0;x<cols-1;x++){
          var a=g[y*cols+x], b=g[y*cols+x+1], c=g[(y+1)*cols+x+1], d=g[(y+1)*cols+x];
          var k=(a>L?8:0)|(b>L?4:0)|(c>L?2:0)|(d>L?1:0);
          if(k===0||k===15) continue;
          var x0=x*step, y0=y*step, segs=SEG[k];
          for(var s=0;s<segs.length;s++){
            var p = pt(segs[s][0], x0, y0, step, L, a, b, c, d);
            var q = pt(segs[s][1], x0, y0, step, L, a, b, c, d);
            ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]);
          }
        }
      }
      ctx.strokeStyle = isIndex ? bold : thin;
      ctx.lineWidth = isIndex ? 1.8 : 1;
      ctx.stroke();
    }
  }

  /* ---------- start ---------- */
  renderProfile();
  var st = unstash();
  if(st && st.path) path = st.path;
  renderCollections();
  drawCover();
  if(st && st.y){ requestAnimationFrame(function(){ window.scrollTo(0, st.y); }); }
  try {
    if(window.ResizeObserver){ new ResizeObserver(function(){ drawCover(); }).observe($('cover')); }
    else { window.addEventListener('resize', drawCover); }
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if(mq.addEventListener){ mq.addEventListener('change', drawCover); }
    new MutationObserver(drawCover).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  } catch(err){}

  detect().then(function(){
    var want = false;
    try{ want = sessionStorage.getItem('sp_edit') === '1'; }catch(e){}
    if(want && viewer.canEdit) enterEdit(false);
    else if(want){ try{ sessionStorage.removeItem('sp_edit'); }catch(e){} }
  });
})();
</script>
